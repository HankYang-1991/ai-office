name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare artifact readiness check
        run: npm install --prefix "$RUNNER_TEMP/pages-metadata" --ignore-scripts --no-audit --no-fund @actions/artifact@2.1.8

      - name: Upload artifact
        id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Wait for this upload to become visible
        uses: ./.github/actions/wait-pages-artifact
        timeout-minutes: 2
        env:
          PAGES_METADATA_SDK: ${{ runner.temp }}/pages-metadata
          PAGES_ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
